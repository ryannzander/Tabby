name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # version comes from package.json "packageManager"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      # OpenZeppelin comes from pnpm; foundry.toml remaps it into node_modules.
      - run: pnpm install --frozen-lockfile
      - uses: foundry-rs/foundry-toolchain@v1
      - name: forge test
        working-directory: packages/contracts
        run: forge test -vv

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # version comes from package.json "packageManager"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: protocol tests
        run: pnpm --filter @tappy/protocol test
      - name: web tests
        run: pnpm --filter @tappy/web test
      - name: typecheck
        run: pnpm typecheck
      # `next lint` loads next.config.js, which imports env.js and validates. There is no database
      # here and lint does not need one.
      - name: lint
        run: pnpm --filter @tappy/web lint
        env:
          SKIP_ENV_VALIDATION: "1"
      # The build is the only check that resolves modules the way Vercel will. Turbopack serves
      # `dev` and is more forgiving, so a broken production build is otherwise invisible until a
      # deploy fails. No real database is reached: nothing is prerendered.
      - name: build
        run: pnpm --filter @tappy/web build
        env:
          SKIP_ENV_VALIDATION: "1"
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
